# Reny Shaders — Capability Probe Configuration
# Target Stack: Minecraft 1.7.10 / Forge 10.13.4.1614 / OptiFine HD U E7

clouds=off
oldHandLight=false
oldLighting=false
dynamicHandLight=false
shadowTranslucent=true
underwaterOverlay=true

# Profiles configuration
profile.BASELINE=PROBE_MODE:0
profile.CAPABILITY=PROBE_MODE:1
profile.HISTORY=PROBE_MODE:2
profile.MATERIAL=PROBE_MODE:3
profile.FORMATS=PROBE_MODE:4
profile.DEFERRED=PROBE_MODE:5

# Screen layout
screen=<profile> <empty> PROBE_MODE
screen.columns=2

# Custom uniforms declaration for E7 capability verification
uniform.float.reny_sun_y=sunPosition.y
uniform.bool.reny_in_water=is_in_water
uniform.int.reny_time=worldTime
